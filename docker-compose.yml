version: '3.8'

services:
  eduaccess-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduaccess-ai-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - ENVIRONMENT=production
      - MOCK_AI_MODE=${MOCK_AI_MODE:-false}
      - ALLOWED_ORIGINS=["http://localhost:8000","http://localhost:5173","http://localhost:3000"]
      - MAX_UPLOAD_SIZE_BYTES=5242880
      - MAX_PDF_PAGES=15
      - MAX_INPUT_TEXT_LENGTH=25000
      - RATE_LIMIT_PER_MINUTE=60
      - RATE_LIMIT_AI_PER_MINUTE=20
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
